<!DOCTYPE html>

<!-- Mateus Geisel 205970-->

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Tênis</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px auto;
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:focus {
            outline: none;
            box-shadow: 0 0 5px #7b92aa;
        }

        .court {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .players {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .player-side {
            text-align: center;
            position: absolute;
            width: 120px;
        }

        .player-side img {
            width: 120px;
            height: auto;
            border: 2px solid #000;
            border-radius: 5px;
            transition: transform 0.3s;
        }

        .player-side img:hover {
            transform: scale(1.1);
        }

        .server-indicator {
            text-align: center;
            margin: 20px 0;
        }

        .centered {
            text-align: center;
            margin: 20px 0;
        }

        .form-container {
            text-align: center;
            margin: 20px;
        }

        .player-inputs {
            display: flex;
            justify-content: center;
        }

        .player-inputs div {
            margin: 0 10px;
        }

        .photo-inputs {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .photo-inputs div {
            margin: 0 10px;
        }

        #score, #gameSummary {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
        }

        .tennis-court {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 400px;
            background-color: #0d6334;
            border: 2px solid #000;
            margin-bottom: 20px;
        }

        .tennis-court::before,
        .tennis-court::after,
        .tennis-court .line {
            content: '';
            position: absolute;
            background-color: white;
        }

        .line {
            width: 2px;
            height: 100%;
        }

        .line1 { left: 25%; }
        .line2 { left: 50%; }
        .line3 { left: 75%; }

        .horizontal-line {
            position: absolute;
            width: 50%;
            height: 2px;
            background-color: white;
            top: 50%;
            left: 25%;
            transform: translateY(-50%);
        }

        #player1 { left: 10px; top: 50%; transform: translateY(-50%); }
        #player2 { right: 10px; top: 50%; transform: translateY(-50%); }

        .winner-message {
            color: green;
            font-weight: bold;
            font-size: 24px;
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Simulador de Tênis</h1>

    <div class="form-container">
        <div class="player-inputs">
            <div>
                <label for="player1Name">Nome do Jogador 1:</label>
                <input type="text" id="player1Name">
            </div>
            <div>
                <label for="player2Name">Nome do Jogador 2:</label>
                <input type="text" id="player2Name">
            </div>
        </div>

        <div class="photo-inputs">
            <div>
                <label for="player1Photo">Escolha a Foto Jogador 1:</label>
                <input type="file" id="player1Photo" accept="image/*">
            </div>
            <div>
                <label for="player2Photo">Escolha a Foto Jogador 2:</label>
                <input type="file" id="player2Photo" accept="image/*">
            </div>
        </div>
    </div>

    <div class="centered">
        <h3>Quem começa sacando?</h3>
        <label>
            <input type="radio" name="server" value="player1" checked>
            <span id="player1NameDisplayRadio">Jogador 1</span>
        </label>
        <label>
            <input type="radio" name="server" value="player2">
            <span id="player2NameDisplayRadio">Jogador 2</span>
        </label>
    </div>

    <div style="text-align: center;">
        <button id="startGame">Iniciar Jogo</button>
    </div>

    <div id="court" class="court">
        <h2>Quadra de Tênis</h2>
        <div class="tennis-court">
            <div class="line line1"></div>
            <div class="line line2"></div>
            <div class="line line3"></div>
            <div class="horizontal-line"></div>
            <div id="player1" class="player-side">
                <strong id="player1NameDisplay"></strong>
                <img id="player1PhotoDisplay" alt="Foto do Jogador 1">
            </div>
            <div id="player2" class="player-side">
                <strong id="player2NameDisplay"></strong>
                <img id="player2PhotoDisplay" alt="Foto do Jogador 2">
            </div>
        </div>
        <div id="serverIndicator" class="server-indicator">
            <h3>Jogador que está sacando:</h3>
            <span id="currentServer"></span>
        </div>
        <button id="addPointPlayer1">Adicionar Ponto Jogador 1</button>
        <button id="addPointPlayer2">Adicionar Ponto Jogador 2</button>
        <button id="faultButton">Dupla Falta</button>
        <button id="changeSideButton">Trocar de Quadra</button>
    </div>

    <div id="score"></div>
    <div id="gameSummary"></div>
    
    <script src="script.js"></script>
</body>
</html>
